<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neocosmo | Navigation Config</title>
  <meta name="description" content="Konfigurationsseite für die Navigation." />
  <link rel="stylesheet" href="website/styles.css" />
</head>
<body class="nc-config-page">
  <main class="nc-container nc-config">
    <header class="nc-config__header">
      <h1>Navigation konfigurieren</h1>
      <p class="nc-lead">Ändere Labels, Links und Untermenüs für Deutsch und Englisch. Änderungen werden lokal gespeichert.</p>
      <div class="nc-config__actions">
        <button class="button accent" type="button" data-action="save">Speichern</button>
        <button class="button outline" type="button" data-action="reset">Zurücksetzen</button>
      </div>
      <p class="nc-config__status" role="status" aria-live="polite"></p>
    </header>

    <div id="nav-config-root"></div>
  </main>
  <script type="module" src="website/js/nav-config.js"></script>
</body>
</html>
