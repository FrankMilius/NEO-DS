openapi: 3.1.0
info:
  title: NEO Theme-Konfigurator – Speicher-Schnittstelle
  version: 1.1.1
  description: |
    Vertrag zwischen Theme-Konfigurator (Vue-App) und Drupal 11 (neo Workplace,
    Config Tools), abgestimmt mit der Drupal-Entwicklung am 01.10.2026
    (Plan v2, 2.6). Entscheidungen und Folgen: docs/adr/ADR-002-speichern-in-drupal.md.

    Grundsätze
    - Eine Drupal-Instanz je Kunde, daher kein Kunden-Segment im Pfad.
      Mehrere Themes je Instanz, genau eines ist aktiv.
    - Ablage als Config Entity, ohne Drupal-Revisionen. Es gibt keinen
      Verlauf und kein Zurücksetzen im Server.
    - Gespeichert werden nur die ABWEICHUNGEN vom NEO-Standard
      (Schema ThemeAbweichungen). Beim Lesen führt die App sie mit dem
      aktuellen Standard (GET /neo-standard) zusammen; ein neuer Standard
      wirkt dadurch automatisch auf alle Themes.
    - Konflikterkennung ohne Sperre: Jede Antwort mit einem Theme liefert
      den Header ETag = SHA-256 des kanonischen JSON von
      { meta: { name, version }, abweichungen } (Hex, in Anführungszeichen).
      Ändernde Aufrufe senden If-Match. Fehlt er, antwortet der Server mit
      428, passt er nicht, mit 412 und dem aktuellen ETag. Die App lädt dann
      neu und lässt die Person entscheiden.
    - Kanonisches JSON: Objektschlüssel rekursiv sortiert, Listen in ihrer
      Reihenfolge, keine Leerzeichen, Unicode und Schrägstriche unmaskiert.
      Prüfvektor: { "meta": { "name": "Beispiel", "version": "1.0.0" },
      "abweichungen": {} } ergibt
      21bd9c5994626d8dce75705b8e20cd10683c9bc3efa98ad7e649ac12eab92a33.
    - Validierung: Der Server prüft jeden Theme-Körper gegen das JSON-Schema
      (ThemeAbweichungen) und weist Anfragen über 1 MB (1 048 576 Bytes) mit
      413 ab (Erweiterung x-neo-max-bytes am Request-Body).
    - Veröffentlichen nur mit bestandener Kontrast-Prüfung. Die App schickt
      ihr Ergebnis mit, der Server rechnet verbindlich selbst nach (gleiche
      Paarliste data/kontrast-paare.json) und lehnt mit 422 ab. Ein Recht zum
      Übergehen gibt es nicht.
    - Rechte je Operation in der Erweiterung x-neo-recht: ansehen,
      bearbeiten, veroeffentlichen (Drupal-Permissions, siehe ADR-002).
      Fehlt das Recht, antwortet der Server mit 403.
    - Anmeldung über die Drupal-Sitzung (Cookie); die App ist in eine
      Drupal-Seite eingebettet. Ändernde Aufrufe mit X-CSRF-Token (per
      drupalSettings oder GET /session/token).
    - Fehler als application/problem+json (RFC 9457).

    Ergänzungen 1.1.0 (14.10.2026, Entscheidungen Frank; abwärtskompatibel):
    - NEO-Standard aktivieren: POST /neo-standard/aktivieren — danach ist
      kein Theme aktiv, die Website zeigt das reine NEO Design System.
    - Website-Vorschau je angemeldeter Person: PUT/GET/DELETE /vorschau.
      Bearbeiter sehen den gespeicherten Stand eines Themes sofort auf der
      Website, Besucher weiter das aktive, veröffentlichte Theme.
    - Schriften auf dem Server: GET/POST /schriften, DELETE
      /schriften/{schnittId}. Quellen: hochgeladen (Rohdaten, höchstens
      5 MB, woff2/woff/ttf/otf) und ein Server-Ordner, den der Betrieb per
      Deployment befüllt. Der Server erzeugt daraus eine @font-face-Datei
      (cssUrl) für Website und App — ohne Anfragen an Dritte.
    - Im Drupal-Betrieb arbeitet die App im Set „neo“; das veröffentlichte
      CSS enthält nur Abweichungen vom NEO-Standard (.neo-light-theme /
      .neo-dark-theme / :root) und Google-Fonts-Adressen als @import.

    Ergänzung 1.1.1 (15.10.2026, Usability-Audit UX-02): Der Server prüft
    das CSS beim Veröffentlichen und bei der Vorschau auf die Grammatik der
    App — nur Kommentare (ohne < >), @import von fonts.googleapis.com und
    Blöcke „Selektor { --name: wert; … }“ mit eigenen Eigenschaften. Alles
    andere (fremde Eigenschaften wie display, verschachtelte Blöcke, fremde
    @-Regeln, Markup) lehnt er mit 422 ab (fehler: „css: …“). Referenz:
    pruefeCss() in apps/theme-configurator/src/utils/css-wert.js.

    Gegenstück in der App: apps/theme-configurator/src/speicher/drupal.js.
servers:
  - url: /api/neo-theme-konfigurator/v1
    description: Relativ zur Drupal-Instanz des Kunden
security:
  - drupalSitzung: []
tags:
  - name: Themes
  - name: Veroeffentlichen
  - name: Standard
  - name: Export
  - name: Vorschau
  - name: Schriften
paths:
  /neo-standard:
    get:
      tags: [Standard]
      operationId: ladeNeoStandard
      summary: NEO-Standard (Werkseinstellung) mit Version lesen
      x-neo-recht: ansehen
      description: |
        Inhalt von data/neo-theme-defaults/neo-theme-defaults.json, das mit dem
        Design System ausgeliefert wird (Entscheidung Frage 9a). Grundlage für
        das Zusammenführen der Abweichungen. Die Version steht in _meta.version
        und zusätzlich im Header ETag.
      responses:
        '200':
          description: NEO-Standard
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeoStandard'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
  /themes:
    get:
      tags: [Themes]
      operationId: listeThemes
      summary: Themes der Instanz auflisten (mit aktiv)
      x-neo-recht: ansehen
      responses:
        '200':
          description: Katalog (nur Metadaten); genau ein Eintrag hat aktiv = true, solange überhaupt eines aktiviert wurde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeListe'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
    post:
      tags: [Themes]
      operationId: legeThemeAn
      summary: Theme anlegen
      x-neo-recht: bearbeiten
      security:
        - drupalSitzung: []
          csrfToken: []
      requestBody:
        required: true
        x-neo-max-bytes: 1048576
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeDokument'
      responses:
        '201':
          description: Angelegt
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: URL des neuen Themes
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeDokument'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
        '413':
          $ref: '#/components/responses/ZuGross'
        '422':
          $ref: '#/components/responses/Ungueltig'
  /themes/{themeId}:
    parameters:
      - $ref: '#/components/parameters/ThemeId'
    get:
      tags: [Themes]
      operationId: ladeTheme
      summary: Theme lesen (Abweichungen vom Standard)
      x-neo-recht: ansehen
      responses:
        '200':
          description: Theme mit Abweichungen; ETag = Inhalts-Hash
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeDokument'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
        '404':
          $ref: '#/components/responses/NichtGefunden'
    put:
      tags: [Themes]
      operationId: speichereTheme
      summary: Theme speichern (mit Konflikterkennung)
      x-neo-recht: bearbeiten
      description: |
        Überschreibt die Config Entity. If-Match ist Pflicht und muss der ETag
        des Stands sein, auf dem die Änderung beruht. Hat inzwischen jemand
        anderes gespeichert, antwortet der Server mit 412 und dem aktuellen
        ETag. Ein veröffentlichtes Theme behält seine veröffentlichte CSS-Datei,
        sein Status wird geaendert-seit-veroeffentlichung.
      security:
        - drupalSitzung: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        x-neo-max-bytes: 1048576
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeDokument'
      responses:
        '200':
          description: Gespeichert
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeDokument'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '412':
          $ref: '#/components/responses/Veraltet'
        '413':
          $ref: '#/components/responses/ZuGross'
        '422':
          $ref: '#/components/responses/Ungueltig'
        '428':
          $ref: '#/components/responses/IfMatchFehlt'
    delete:
      tags: [Themes]
      operationId: loescheTheme
      summary: Theme löschen
      x-neo-recht: bearbeiten
      description: Das aktive Theme kann nicht gelöscht werden (409).
      security:
        - drupalSitzung: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Gelöscht
        '403':
          $ref: '#/components/responses/Verboten'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '412':
          $ref: '#/components/responses/Veraltet'
        '428':
          $ref: '#/components/responses/IfMatchFehlt'
  /themes/{themeId}/aktivieren:
    parameters:
      - $ref: '#/components/parameters/ThemeId'
    post:
      tags: [Veroeffentlichen]
      operationId: aktiviereTheme
      summary: Theme aktivieren (genau eines ist aktiv)
      x-neo-recht: veroeffentlichen
      description: |
        Macht dieses Theme zum aktiven und nimmt dem bisherigen den Status.
        Nur ein veröffentlichtes Theme kann aktiviert werden (sonst 409). Der
        Server legt die veröffentlichte CSS-Datei des Themes an den Pfad, den
        der Library-Override des Frontend-Themes referenziert, und leert die
        betroffenen Caches. Antwort ist die neue Liste.
      security:
        - drupalSitzung: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Aktiviert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeListe'
        '403':
          $ref: '#/components/responses/Verboten'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
  /themes/{themeId}/veroeffentlichen:
    parameters:
      - $ref: '#/components/parameters/ThemeId'
    post:
      tags: [Veroeffentlichen]
      operationId: veroeffentlicheTheme
      summary: Theme veröffentlichen (Kontrast-Prüfung als Tor, CSS ablegen)
      x-neo-recht: veroeffentlichen
      description: |
        Veröffentlicht den gespeicherten Stand aus If-Match (412, wenn er nicht
        mehr aktuell ist). Die App schickt ihr Kontrast-Ergebnis und das CSS
        (exportAsCSSVars) mit. Der Server führt Standard und Abweichungen
        selbst zusammen, prüft den Kontrast verbindlich mit
        data/kontrast-paare.json und lehnt mit 422 ab (Befunde im Feld
        kontrast). Bei Erfolg legt er das CSS versioniert ab; ist das Theme
        aktiv, liefert er es sofort über den Library-Override aus und leert
        die Caches.
      security:
        - drupalSitzung: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        x-neo-max-bytes: 1048576
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeroeffentlichenAnfrage'
      responses:
        '200':
          description: Veröffentlicht
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeroeffentlichenAntwort'
        '403':
          $ref: '#/components/responses/Verboten'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '412':
          $ref: '#/components/responses/Veraltet'
        '413':
          $ref: '#/components/responses/ZuGross'
        '422':
          $ref: '#/components/responses/KontrastNichtBestanden'
        '428':
          $ref: '#/components/responses/IfMatchFehlt'
  /themes/{themeId}/export:
    parameters:
      - $ref: '#/components/parameters/ThemeId'
    get:
      tags: [Export]
      operationId: exportiereTheme
      summary: Theme exportieren (veröffentlichtes CSS oder gespeicherte Abweichungen)
      x-neo-recht: ansehen
      description: |
        format=css liefert die zuletzt veröffentlichte CSS-Datei (404, wenn
        nie veröffentlicht). format=abweichungen liefert das gespeicherte
        ThemeDokument, Eingabe für das Prüfwerkzeug
        scripts/pruefe-kunden-themes.mjs vor dem Ausrollen eines neuen
        NEO-Standards. DTCG und Theme-JSON exportiert die App selbst.
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [css, abweichungen]
      responses:
        '200':
          description: Exportdatei
          content:
            text/css:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeDokument'
        '403':
          $ref: '#/components/responses/Verboten'
        '404':
          $ref: '#/components/responses/NichtGefunden'
  /neo-standard/aktivieren:
    post:
      tags: [Standard]
      operationId: aktiviereNeoStandard
      summary: NEO-Standard aktivieren (kein Theme aktiv) — seit 1.1.0
      x-neo-recht: veroeffentlichen
      description: |
        Nimmt dem aktiven Theme den Status. Die Website liefert danach wieder
        die unveränderte Datei des Frontend-Themes aus (theme-overrides.css)
        und zeigt das reine NEO Design System. Die Themes bleiben erhalten.
        Antwort ist die neue Liste (kein Eintrag mit aktiv = true).
      security:
        - drupalSitzung: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: NEO-Standard aktiv
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeListe'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
  /vorschau:
    get:
      tags: [Vorschau]
      operationId: ladeVorschau
      summary: Eigene Website-Vorschau lesen — seit 1.1.0
      x-neo-recht: ansehen
      responses:
        '200':
          description: Vorschau gesetzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vorschau'
        '204':
          description: Keine Vorschau gesetzt
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
    put:
      tags: [Vorschau]
      operationId: setzeVorschau
      summary: Website-Vorschau auf ein gespeichertes Theme setzen — seit 1.1.0
      x-neo-recht: bearbeiten
      description: |
        Gilt nur für die angemeldete Person: Sie sieht auf der Website das
        mitgeschickte CSS (Stand des Themes, von der App erzeugt) statt des
        aktiven Themes, mit einem Hinweis „Vorschau beenden“. Besucher sehen
        weiter das aktive, veröffentlichte Theme. Keine Kontrastprüfung.
      security:
        - drupalSitzung: []
          csrfToken: []
      requestBody:
        required: true
        x-neo-max-bytes: 1048576
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VorschauAnfrage'
      responses:
        '200':
          description: Vorschau gesetzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vorschau'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '413':
          $ref: '#/components/responses/ZuGross'
        '422':
          $ref: '#/components/responses/Ungueltig'
    delete:
      tags: [Vorschau]
      operationId: beendeVorschau
      summary: Eigene Website-Vorschau beenden — seit 1.1.0
      x-neo-recht: bearbeiten
      security:
        - drupalSitzung: []
          csrfToken: []
      responses:
        '204':
          description: Beendet (auch wenn keine gesetzt war)
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
  /schriften:
    get:
      tags: [Schriften]
      operationId: ladeSchriften
      summary: Schriften auf dem Server — seit 1.1.0
      x-neo-recht: ansehen
      description: |
        Alle Schnitte aus beiden Quellen, nach Familie gruppiert, und die
        URL der @font-face-Datei (cssUrl, wechselt mit jedem Stand). Der
        Server-Ordner wird beim Abruf und bei jedem Cache-Rebuild neu gelesen.
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchriftListe'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
    post:
      tags: [Schriften]
      operationId: ladeSchriftHoch
      summary: Schriftdatei hochladen (ein Schnitt) — seit 1.1.0
      x-neo-recht: veroeffentlichen
      description: |
        Körper sind die Bytes der Datei (kein multipart). Angaben als
        Query-Parameter. Geprüft werden Endung, Inhaltskennung der Datei,
        Größe (höchstens 5 MB) und die Angaben. Ein vorhandener Schnitt
        (gleiche Familie, Gewicht, Stil) wird nicht überschrieben (409).
      security:
        - drupalSitzung: []
          csrfToken: []
      parameters:
        - name: familie
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9 _-]{0,59}$'
        - name: gewicht
          in: query
          required: false
          schema:
            type: integer
            enum: [100, 200, 300, 400, 500, 600, 700, 800, 900]
            default: 400
        - name: stil
          in: query
          required: false
          schema:
            type: string
            enum: [normal, italic]
            default: normal
        - name: datei
          in: query
          required: true
          description: Dateiname mit Endung woff2, woff, ttf oder otf
          schema:
            type: string
      requestBody:
        required: true
        x-neo-max-bytes: 5242880
        content:
          font/woff2:
            schema:
              type: string
              format: binary
          font/woff:
            schema:
              type: string
              format: binary
          font/ttf:
            schema:
              type: string
              format: binary
          font/otf:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Hochgeladen; Antwort ist die neue Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchriftListe'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
        '409':
          $ref: '#/components/responses/Konflikt'
        '413':
          $ref: '#/components/responses/ZuGross'
        '422':
          $ref: '#/components/responses/Ungueltig'
  /schriften/{schnittId}:
    parameters:
      - name: schnittId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9_]+$'
    delete:
      tags: [Schriften]
      operationId: loescheSchrift
      summary: Hochgeladenen Schnitt löschen — seit 1.1.0
      x-neo-recht: veroeffentlichen
      description: |
        Nur hochgeladene Schnitte. Schnitte aus dem Server-Ordner verwaltet
        der Betrieb (409). Antwort ist die neue Liste.
      security:
        - drupalSitzung: []
          csrfToken: []
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchriftListe'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/Verboten'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
components:
  securitySchemes:
    drupalSitzung:
      type: apiKey
      in: cookie
      name: SESSxxxxxxxx
      description: Drupal-Sitzungscookie (Name je Instanz verschieden)
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token per drupalSettings oder von GET /session/token (Drupal-Core)
  parameters:
    ThemeId:
      name: themeId
      in: path
      required: true
      description: Maschinenname der Config Entity
      schema:
        type: string
        pattern: '^[a-z0-9_]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (Inhalts-Hash) des Stands, auf dem die Änderung beruht
      schema:
        type: string
  headers:
    ETag:
      description: Starker ETag in Anführungszeichen, SHA-256 (Hex) des kanonischen JSON von { meta { name, version }, abweichungen }; bei /neo-standard die Standard-Version
      schema:
        type: string
  responses:
    NichtAngemeldet:
      description: Nicht angemeldet
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Verboten:
      description: Recht fehlt (x-neo-recht) oder CSRF-Token ungültig
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NichtGefunden:
      description: Nicht gefunden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Konflikt:
      description: Zustandskonflikt (aktives Theme löschen, nicht veröffentlichtes Theme aktivieren)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Veraltet:
      description: If-Match passt nicht – jemand anderes hat inzwischen gespeichert
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IfMatchFehlt:
      description: If-Match fehlt
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ZuGross:
      description: Anfrage größer als 1 MB (1 048 576 Bytes)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Ungueltig:
      description: Daten abgelehnt (JSON-Schema ThemeAbweichungen, Farbwerte)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    KontrastNichtBestanden:
      description: Server-Kontrastprüfung nicht bestanden (Befunde in kontrast) oder Daten ungültig
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457, ergänzt um aktuellerEtag, fehler und kontrast
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        aktuellerEtag:
          type: string
          description: Bei 412 – ETag des aktuellen Stands
        fehler:
          type: array
          description: Fundstellen (Schemafehler, Kontrast-Paare)
          items:
            type: string
        kontrast:
          $ref: '#/components/schemas/KontrastErgebnis'
    ThemeSet:
      type: string
      enum: [neo, customer]
    TeilProSet:
      type: object
      description: Abweichung je Theme-Set; nur die Sets, die vom Standard abweichen
      additionalProperties: false
      properties:
        neo: {}
        customer: {}
    ThemeMeta:
      type: object
      required: [name, version]
      properties:
        id:
          type: string
          description: Maschinenname; beim Anlegen vom Server vergeben, beim Speichern gleich dem Pfad
        name:
          type: string
        version:
          type: string
          description: Fachliche Version (z. B. 1.2.0), frei vergeben
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        hash:
          type: string
          readOnly: true
          description: Inhalts-Hash (= ETag ohne Anführungszeichen)
        aktiv:
          type: boolean
          readOnly: true
          description: Genau ein Theme der Instanz ist aktiv
        status:
          type: string
          readOnly: true
          enum: [entwurf, veroeffentlicht, geaendert-seit-veroeffentlichung]
        veroeffentlichtAm:
          type: [string, 'null']
          format: date-time
          readOnly: true
        geaendertVon:
          type: string
          readOnly: true
          description: Anzeigename der Person, die zuletzt gespeichert hat
    ThemeAbweichungen:
      type: object
      x-neo-max-bytes: 1048576
      additionalProperties: false
      description: |
        Speicherformat (Entscheidung C, auf Abweichungen reduziert) –
        Teilmenge von ThemeDaten. Gleiche Struktur wie der App-Stand
        (THEME_DATA_KEYS in apps/theme-configurator/src/stores/theme/theme-schluessel.js),
        aber nur die Schlüssel und Werte, die vom NEO-Standard abweichen.
        Objekte werden rekursiv verglichen, Listen und Werte anderen Typs als
        Ganzes ersetzt. Ein Schlüssel, den der Standard hat, das Theme aber
        nicht, steht als Objekt mit genau dem Feld $entfernt = true darin.
        Ein leeres Objekt heißt Theme gleich Standard. Referenz für
        Berechnen und Zusammenführen (auch für PHP):
        apps/theme-configurator/src/speicher/abweichungen.js.
      properties:
        activeThemeSet:
          $ref: '#/components/schemas/ThemeSet'
        themes:
          $ref: '#/components/schemas/TeilProSet'
        foundationOverrides:
          $ref: '#/components/schemas/TeilProSet'
        componentOverrides:
          $ref: '#/components/schemas/TeilProSet'
        primitiveOverrides:
          $ref: '#/components/schemas/TeilProSet'
        customFonts:
          $ref: '#/components/schemas/TeilProSet'
        focusRingMode:
          $ref: '#/components/schemas/TeilProSet'
        componentLocks:
          $ref: '#/components/schemas/TeilProSet'
        componentVersions:
          $ref: '#/components/schemas/TeilProSet'
        variantDefinitions:
          $ref: '#/components/schemas/TeilProSet'
        customSpacingTokens:
          $ref: '#/components/schemas/TeilProSet'
        customRadiiTokens:
          $ref: '#/components/schemas/TeilProSet'
        customBorderWidthTokens:
          $ref: '#/components/schemas/TeilProSet'
        customMediaRatioTokens:
          $ref: '#/components/schemas/TeilProSet'
        customShadowTokens:
          $ref: '#/components/schemas/TeilProSet'
        customElevationTokens:
          $ref: '#/components/schemas/TeilProSet'
        customOpacityTokens:
          $ref: '#/components/schemas/TeilProSet'
        customZindexTokens:
          $ref: '#/components/schemas/TeilProSet'
        customMotionTokens:
          $ref: '#/components/schemas/TeilProSet'
        customMotionEffectTokens:
          $ref: '#/components/schemas/TeilProSet'
        iconLibraries:
          $ref: '#/components/schemas/TeilProSet'
        iconStrokeWidths:
          $ref: '#/components/schemas/TeilProSet'
        iconStrokeColors:
          $ref: '#/components/schemas/TeilProSet'
        semanticSpacing:
          $ref: '#/components/schemas/TeilProSet'
        semanticTypography:
          $ref: '#/components/schemas/TeilProSet'
        typeScale:
          $ref: '#/components/schemas/TeilProSet'
      example:
        activeThemeSet: customer
        primitiveOverrides:
          customer:
            primary: '#0b5cad'
        themes:
          customer:
            light:
              text-link: '#0b5cad'
        foundationOverrides:
          neo:
            $entfernt: true
    ThemeDokument:
      type: object
      required: [meta, abweichungen]
      properties:
        meta:
          $ref: '#/components/schemas/ThemeMeta'
        abweichungen:
          $ref: '#/components/schemas/ThemeAbweichungen'
        standardVersion:
          type: [string, 'null']
          description: Version des NEO-Standards, gegen den die App die Abweichungen berechnet hat (nur zur Information; geladen wird immer gegen den aktuellen Standard)
    ThemeListe:
      type: object
      required: [themes]
      properties:
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeMeta'
    KontrastErgebnis:
      type: object
      description: Ergebnis von pruefeKontrast() (apps/theme-configurator/src/speicher/kontrast.js) mit der Paarliste data/kontrast-paare.json
      required: [bestanden, verfahren, ergebnisse]
      properties:
        bestanden:
          type: boolean
        verfahren:
          type: string
        geprueftAm:
          type: string
          format: date-time
        ergebnisse:
          type: array
          items:
            type: object
            required: [modus, vordergrund, hintergrund, mindestens]
            properties:
              modus:
                type: string
                enum: [light, dark]
              vordergrund:
                type: string
              hintergrund:
                type: string
              verhaeltnis:
                type: [number, 'null']
              mindestens:
                type: number
              bestanden:
                type: [boolean, 'null']
                description: null = nicht bewertbar (kein Hex-Wert), zählt als nicht bestanden
    VeroeffentlichenAnfrage:
      type: object
      required: [kontrast, css]
      properties:
        kontrast:
          $ref: '#/components/schemas/KontrastErgebnis'
        css:
          type: string
          description: CSS-Variablen des aktiven Theme-Sets, erzeugt von exportAsCSSVars() der App
        notiz:
          type: string
          description: Wird protokolliert (Drupal-Log)
    VeroeffentlichenAntwort:
      type: object
      required: [meta, css]
      properties:
        meta:
          $ref: '#/components/schemas/ThemeMeta'
        css:
          type: object
          required: [pfad, version]
          properties:
            pfad:
              type: string
              description: Stream-Pfad der Datei, z. B. public://neo-theme/theme.css (vom Modul festgelegt)
            url:
              type: string
              description: Öffentliche URL mit Versionsparameter
            version:
              type: string
              description: Version der Datei (zählt bei jedem Veröffentlichen hoch)
            hash:
              type: string
              description: SHA-256 des CSS
            ausgeliefert:
              type: boolean
              description: true, wenn das Theme aktiv ist und die Datei über den Library-Override ausgeliefert wird
    Vorschau:
      type: object
      required: [themeId, name, seit]
      properties:
        themeId:
          type: string
        name:
          type: string
        seit:
          type: string
          format: date-time
    VorschauAnfrage:
      type: object
      required: [themeId, css]
      properties:
        themeId:
          type: string
          pattern: '^[a-z0-9_]+$'
        css:
          type: string
          description: CSS des Themes (exportAsCSSVars, nur Abweichungen)
    SchriftSchnitt:
      type: object
      required: [id, gewicht, stil, format, url]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_]+$'
        gewicht:
          type: integer
        stil:
          type: string
          enum: [normal, italic]
        format:
          type: string
          enum: [woff2, woff, truetype, opentype]
        url:
          type: string
    SchriftFamilie:
      type: object
      required: [familie, quelle, schnitte]
      properties:
        familie:
          type: string
        quelle:
          type: string
          enum: [hochgeladen, server]
        schnitte:
          type: array
          items:
            $ref: '#/components/schemas/SchriftSchnitt'
    SchriftListe:
      type: object
      required: [schriften, cssUrl]
      properties:
        schriften:
          type: array
          items:
            $ref: '#/components/schemas/SchriftFamilie'
        cssUrl:
          type: [string, 'null']
          description: URL der @font-face-Datei (null, solange es keine Schriften gibt)
    NeoStandard:
      type: object
      description: Inhalt von data/neo-theme-defaults/neo-theme-defaults.json (mit dem Design System ausgeliefert)
      required: [_meta, themes, foundationOverrides, componentOverrides, primitiveOverrides]
      properties:
        _meta:
          type: object
          required: [version]
          properties:
            version:
              type: string
            generatedAt:
              type: string
              format: date-time
        themes:
          type: object
        foundationOverrides:
          type: object
        componentOverrides:
          type: object
        primitiveOverrides:
          type: object
