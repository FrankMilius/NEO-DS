<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="stylesheet" href="../styles.css" />
{{styles}}
</head>
<body class="neo-light-theme">

  <!-- Sidebar Overlay (mobile) -->
  <div class="docs-sidebar-overlay" id="docs-sidebar-overlay"></div>

  <div class="docs-layout">
    <!-- Documentation Header -->
    <header class="docs-header" id="docs-header">
      <button class="docs-header__menu-btn" id="docs-sidebar-open" aria-label="Navigation öffnen">
        <svg class="docs-header__icon-burger" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg>
        <svg class="docs-header__icon-sidebar" viewBox="0 0 24 24" fill="none"><g transform="translate(12,12) scale(-1,1) translate(-12,-12)"><path d="M10,12 L16.5,12 L13.5,9 M13.5,15 L16.5,12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
      </button>
      <a class="docs-header__title" href="./" style="text-decoration:none;color:inherit">NEO Design System</a>
      <div class="docs-header__search" id="docs-header-search">
        <button class="docs-header__search-btn" id="docs-search-toggle" aria-label="Suche öffnen" aria-expanded="false">
          <svg class="docs-header__search-icon" viewBox="0 0 24 24" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><line x1="21" y1="21" x2="15" y2="15" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <div class="docs-header__search-field" id="docs-search-field" hidden>
          <div class="nc-input-wrapper">
            <span class="nc-input__icon"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="21" y1="21" x2="15" y2="15" stroke="currentColor" stroke-width="1.5"/></svg></span>
            <input class="nc-input nc-input--sm nc-input--search" type="search" id="docs-search-input" placeholder="Suchen..." aria-label="Dokumentation durchsuchen" />
          </div>
          <button class="docs-header__search-close" id="docs-search-close" aria-label="Suche schließen"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/></svg></button>
        </div>
      </div>
      <div class="docs-header__theme-toggle">
        <span class="docs-header__theme-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
        <button class="docs-header__theme-track" id="docs-theme-toggle" role="switch" aria-checked="false" aria-label="Dark Mode">
          <span class="docs-header__theme-thumb"></span>
        </button>
        <span class="docs-header__theme-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8C13.02 3.04 12.52 3 12 3z"/></svg></span>
      </div>
    </header>

    <!-- Sidebar Navigation -->
    <aside class="docs-sidebar" id="docs-sidebar" aria-label="Dokumentations-Navigation"></aside>

    <!-- Content Area -->
{{body}}

  </div><!-- /.docs-layout -->

  <!-- Shared Scripts -->
  <script src="docs-sidebar-loader.js"></script>
  <script src="docs-sidebar-toggle.js"></script>
  <script src="docs-sidebar.js"></script>
  <script src="docs-header-search.js"></script>
  <script src="docs-search.js"></script>
  <script src="docs-theme-toggle.js"></script>
  <script src="docs-tabs.js"></script>
  <script src="docs-toc.js"></script>
  <script src="docs-stage-controls.js"></script>
  <script src="docs-recipe-tab.js"></script>
{{scripts}}

</body>
</html>
