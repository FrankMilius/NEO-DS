
<title>NEO Brand 006</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
  :root{
    /* Graphit-Leiter aus data/design-tokens.json */
    --g50:#f9fbf9; --g100:#f1f3f1; --g200:#e4e6e4; --g300:#d2d4d2; --g400:#afb2af;
    --g500:#909390; --g600:#727572; --g700:#595c59; --g800:#414341; --g900:#292b29; --g950:#161816;

    --ground:var(--g100); --surface:#ffffff; --sunk:var(--g200);
    --text:var(--g950); --muted:var(--g700); --faint:var(--g600);
    --border:var(--g300); --hair:var(--g200);
    --deep:var(--g950); --deep-text:var(--g100); --deep-muted:var(--g400); --deep-hair:var(--g800);
    --signal:#0079ad;
    --plane:rgba(22,24,22,.09);

    --f-brand:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
    --f-info:'Manrope','Helvetica Neue',Arial,sans-serif;
    --f-tech:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --col:1180px; --prose:66ch;
    --u:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0e100e; --surface:#1a1c1a; --sunk:#141614;
      --text:var(--g100); --muted:var(--g400); --faint:var(--g500);
      --border:var(--g800); --hair:#232523;
      --deep:#000000; --deep-text:var(--g100); --deep-muted:var(--g500); --deep-hair:var(--g900);
      --signal:#33b2e9;
      --plane:rgba(241,243,241,.10);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0e100e; --surface:#1a1c1a; --sunk:#141614;
    --text:var(--g100); --muted:var(--g400); --faint:var(--g500);
    --border:var(--g800); --hair:#232523;
    --deep:#000000; --deep-text:var(--g100); --deep-muted:var(--g500); --deep-hair:var(--g900);
    --signal:#33b2e9;
    --plane:rgba(241,243,241,.10);
  }

  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--text);font-family:var(--f-info);
       font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;margin:0;padding:0 24px 120px}
  .wrap{max-width:var(--col);margin:0 auto}
  .prose{max-width:var(--prose)}

  /* ---------- Masthead ---------- */
  .mast{padding:80px 0 0}
  .mast .code{font-family:var(--f-tech);font-size:12px;letter-spacing:.16em;
              text-transform:uppercase;color:var(--faint);margin:0 0 28px;
              display:flex;gap:14px;align-items:center}
  .mast .code::after{content:"";flex:1;height:1px;background:var(--border)}
  h1{font-family:var(--f-brand);font-weight:700;font-size:clamp(42px,7.4vw,86px);
     line-height:.98;letter-spacing:-.035em;margin:0 0 28px;max-width:14ch;text-wrap:balance}
  .lede{font-size:20px;line-height:1.52;color:var(--muted);max-width:60ch;margin:0 0 44px}

  /* Ebenen-Hero */
  .hero{position:relative;height:280px;margin-bottom:44px;background:var(--deep);overflow:hidden}
  .hero .pl{position:absolute;border:1px solid rgba(241,243,241,.30);background:rgba(241,243,241,.055)}
  .hero .p1{left:-4%;top:16%;width:52%;height:62%}
  .hero .p2{left:26%;top:30%;width:52%;height:62%}
  .hero .p3{left:56%;top:8%;width:52%;height:62%}
  .hero .nd{position:absolute;width:11px;height:11px;background:var(--deep-text)}
  .hero .n1{left:34%;top:44%}
  .hero .n2{left:62%;top:52%}
  .hero .sg{position:absolute;left:47%;top:38%;width:13px;height:13px;background:#009ee3}
  .hero .cap{position:absolute;left:0;bottom:0;right:0;padding:16px 22px;
             font-family:var(--f-tech);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
             color:rgba(241,243,241,.62);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

  .meta{display:flex;flex-wrap:wrap;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .meta div{padding:16px 30px 16px 0;margin-right:30px;border-right:1px solid var(--hair)}
  .meta div:last-child{border-right:0;margin-right:0}
  .meta dt{font-family:var(--f-tech);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--faint);margin:0 0 5px}
  .meta dd{margin:0;font-size:15px;font-weight:600}

  /* ---------- Abschnitte ---------- */
  section{padding:88px 0 0;scroll-margin-top:20px}
  .shead{display:grid;grid-template-columns:104px 1fr;gap:28px;align-items:start;
         border-top:1px solid var(--text);padding-top:20px;margin-bottom:34px}
  .snum{font-family:var(--f-tech);font-size:13px;font-weight:700;letter-spacing:.1em;
        color:var(--signal);padding-top:8px}
  h2{font-family:var(--f-brand);font-weight:700;font-size:clamp(28px,4vw,44px);
     line-height:1.04;letter-spacing:-.028em;margin:0 0 14px;max-width:20ch;text-wrap:balance}
  .sdek{font-size:17.5px;color:var(--muted);max-width:var(--prose);margin:0}
  h3{font-family:var(--f-brand);font-weight:500;font-size:20px;letter-spacing:-.014em;
     line-height:1.25;margin:0 0 9px}
  h4{font-family:var(--f-tech);font-size:10.5px;font-weight:400;letter-spacing:.14em;
     text-transform:uppercase;color:var(--faint);margin:0 0 14px}
  p{margin:0 0 17px}p:last-child{margin-bottom:0}
  em{font-style:normal;color:var(--text);font-weight:600;
     box-shadow:inset 0 -0.42em 0 var(--plane)}
  strong{font-weight:700}
  code{font-family:var(--f-tech);font-size:.83em;background:var(--sunk);
       border:1px solid var(--hair);padding:1px 5px}
  a{color:var(--signal)}

  .law{border-left:3px solid var(--signal);padding:6px 0 6px 24px;margin:0 0 34px}
  .law p{font-family:var(--f-brand);font-weight:500;font-size:clamp(21px,2.7vw,29px);
         line-height:1.24;letter-spacing:-.018em;max-width:24ch;margin:0}
  .law .src{font-family:var(--f-tech);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--faint);margin-top:14px}

  /* Figuren */
  figure{margin:0 0 20px;border:1px solid var(--border);background:var(--surface)}
  figure svg{display:block;width:100%;height:auto;max-width:100%}
  figcaption{font-size:13.5px;color:var(--muted);padding:14px 20px;border-top:1px solid var(--hair);
             line-height:1.5}
  figcaption b{color:var(--text);font-weight:600}

  /* Karten-Raster */
  .grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:20px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
  .card{background:var(--surface);padding:26px 26px 28px}
  .card h3{font-size:18px}
  .card p{font-size:14.8px;color:var(--muted);margin:0}
  .card p+p{margin-top:11px}
  .card .lbl{font-family:var(--f-tech);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
             color:var(--faint);margin:0 0 12px}

  /* Tabellen */
  .tbl{overflow-x:auto;border:1px solid var(--border);background:var(--surface);margin-bottom:16px}
  table{border-collapse:collapse;width:100%;min-width:700px;font-size:14.3px}
  thead th{background:var(--surface);font-family:var(--f-tech);font-size:10px;font-weight:400;
           letter-spacing:.13em;text-transform:uppercase;color:var(--faint);text-align:left;
           padding:14px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
  th.r,td.r{text-align:right}
  th.c,td.c{text-align:center}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--hair);vertical-align:middle;line-height:1.42}
  tbody tr:last-child td{border-bottom:0}
  td.m{font-family:var(--f-tech);font-size:12.5px;white-space:nowrap}
  .yes{color:var(--signal);font-weight:700}
  .no{color:var(--faint)}
  .swatch{display:inline-block;width:22px;height:22px;border:1px solid rgba(0,0,0,.22);vertical-align:-6px}

  .tag{font-family:var(--f-tech);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
       padding:3px 8px;white-space:nowrap;display:inline-block;border:1px solid var(--border);color:var(--muted)}
  .tag.on{border-color:var(--signal);color:var(--signal)}
  .tag.off{opacity:.55}

  .note{font-size:13.5px;color:var(--faint);max-width:var(--prose);margin:0 0 34px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px 42px;margin-bottom:20px}
  .cols ul{margin:0;padding-left:19px}
  .cols li{font-size:15px;color:var(--muted);margin-bottom:9px}
  .cols li b{color:var(--text);font-weight:600}

  /* Typografie-Spezimen */
  .spec{background:var(--surface);border:1px solid var(--border);padding:0;margin-bottom:1px}
  .spec .row{padding:26px 28px;border-bottom:1px solid var(--hair)}
  .spec .row:last-child{border-bottom:0}
  .spec .k{font-family:var(--f-tech);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
           color:var(--faint);margin:0 0 12px;display:flex;justify-content:space-between;gap:16px}
  .spec .sample{margin:0;line-height:1.1}

  /* Farbfelder */
  .sw{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:16px;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .sw > div{background:var(--surface)}
  .sw .chip{height:82px;border-bottom:1px solid var(--hair)}
  .sw .info{padding:14px 16px}
  .sw .n{font-size:14px;font-weight:600;margin:0 0 3px}
  .sw .v{font-family:var(--f-tech);font-size:11px;color:var(--muted);margin:0;line-height:1.5}

  /* Node-Formen */
  .nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;
         background:var(--border);border:1px solid var(--border);margin-bottom:16px}
  .node{background:var(--surface);padding:0 0 24px}
  .node .stage{height:128px;display:grid;place-items:center;border-bottom:1px solid var(--hair);
               background:var(--sunk)}
  .node .txt{padding:20px 22px 0}
  .node h3{font-size:17px;margin-bottom:6px}
  .node p{font-size:14px;color:var(--muted);margin:0}

  /* Diagramm-Ebenen dunkel */
  .darkfig{background:var(--deep);border:1px solid var(--border)}
  .darkfig figcaption{border-top:1px solid var(--deep-hair);color:var(--deep-muted);background:var(--deep)}
  .darkfig figcaption b{color:var(--deep-text)}

  .parthead{background:var(--sunk);border:1px solid var(--border);padding:22px 26px;margin:54px 0 0}
  .parthead span{font-family:var(--f-tech);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
                 color:var(--signal);display:block;margin-bottom:8px}
  .parthead h3{font-family:var(--f-brand);font-weight:700;font-size:clamp(21px,2.7vw,28px);
               letter-spacing:-.024em;margin:0 0 8px}
  .parthead p{font-size:15px;color:var(--muted);margin:0;max-width:66ch}
  .parthead + .subhead{margin-top:34px;border-top:0;padding-top:0}

  /* ---------- Unterkapitel ---------- */
  .subhead{display:flex;align-items:baseline;gap:20px;margin:52px 0 20px;
           padding-top:16px;border-top:1px solid var(--border)}
  .subhead span{font-family:var(--f-tech);font-size:12px;color:var(--signal);flex:none;width:84px}
  .subhead h3{font-family:var(--f-brand);font-weight:700;font-size:clamp(20px,2.6vw,27px);
              letter-spacing:-.022em;margin:0}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;
         background:var(--border);border:1px solid var(--border);margin:26px 0 8px}
  .facts > div{background:var(--surface);padding:22px 24px 24px}
  .facts b{display:block;font-family:var(--f-brand);font-weight:700;
           font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em;line-height:1;margin-bottom:9px}
  .facts span{font-size:13.5px;color:var(--muted);line-height:1.4;display:block}

  .statements{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1px;
              background:var(--border);border:1px solid var(--border);margin-bottom:26px}
  .stmt{background:var(--surface);padding:28px 30px 30px;display:flex;flex-direction:column}
  .stmt .lbl{font-family:var(--f-tech);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
             color:var(--faint);margin:0 0 16px}
  .stmt .big{font-family:var(--f-brand);font-weight:500;font-size:clamp(18px,2.3vw,23px);
             line-height:1.26;letter-spacing:-.018em;margin:0 0 auto;padding-bottom:20px}
  .stmt .foot{font-size:13px;color:var(--faint);margin:0;padding-top:14px;border-top:1px solid var(--hair)}

  td.was{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--border);
         text-decoration-thickness:1px;width:26%}
  td.wird{font-weight:600;width:36%}

  .rhythm{display:flex;border:1px solid var(--border);margin-bottom:14px;overflow:hidden}
  .rhythm div{flex:1;padding:20px 16px 22px;font-family:var(--f-tech);font-size:10.5px;
              letter-spacing:.08em;line-height:1.5;min-height:120px}
  .rhythm div b{display:block;font-family:var(--f-brand);font-size:14px;font-weight:700;
                letter-spacing:-.01em;margin-bottom:6px}
  .rhythm div.stage{flex:1.35}

  /* ---------- Verdict, Tags, Verhaeltnis ---------- */
  .verdict{background:var(--surface);border:1px solid var(--border);
           border-left:3px solid var(--signal);padding:22px 26px;margin:0 0 26px}
  .verdict p{font-size:16px;max-width:78ch;margin:0}
  .verdict p + p{margin-top:12px}

  .tag.ok{border-color:var(--signal);color:var(--signal);opacity:1}
  .tag.mid{border-color:var(--faint);color:var(--muted);opacity:1}
  .tag.bad{border-color:var(--faint);color:var(--faint);opacity:1;text-decoration:line-through}

  .ratio{display:flex;border:1px solid var(--border);margin-bottom:14px;height:74px}
  .ratio div{display:flex;align-items:flex-end;padding:10px 14px;font-family:var(--f-tech);
             font-size:11px;letter-spacing:.06em}

  /* ---------- Do / Don't ---------- */
  .dodont{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;
          background:var(--border);border:1px solid var(--border);margin-bottom:22px}
  .dd{background:var(--surface)}
  .ddvis{height:112px;display:flex;align-items:center;justify-content:center;
         border-bottom:1px solid var(--hair)}
  .ddt{font-size:13.8px;color:var(--muted);margin:0;padding:15px 18px 18px;line-height:1.45}
  .ddt b{display:block;font-family:var(--f-tech);font-size:9.5px;letter-spacing:.14em;
         text-transform:uppercase;margin-bottom:6px;font-weight:400}
  .ddt b.do{color:var(--signal)}
  .ddt b.dont{color:var(--faint)}

  /* ---------- Grundflaechen-Leitern ---------- */
  .lads{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1px;
        background:var(--border);border:1px solid var(--border);margin-bottom:16px}
  .lad{background:var(--surface);padding:24px 24px 26px}
  .lhead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:6px}
  .lhead h3{margin:0;font-size:19px}
  .lrole{font-size:14px;color:var(--muted);margin:0 0 18px;min-height:2.9em}
  .lstrip{display:flex;margin-bottom:2px}
  .lstrip i{flex:1;height:58px;position:relative;font-style:normal}
  .lstrip i b{position:absolute;left:7px;bottom:6px;font-family:var(--f-tech);font-size:9.5px;
              font-weight:400;letter-spacing:.06em;color:#161816;opacity:.72}
  .lstrip.dk{margin-bottom:18px}
  .lstrip.dk i b{color:#f1f3f1;opacity:.78}
  .lmeta{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px}
  .lmeta dt{font-family:var(--f-tech);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
            color:var(--faint);padding-top:2px}
  .lmeta dd{margin:0;color:var(--muted)}

  /* ---------- Anwendungsbeispiele ---------- */
  .appfig{margin:0 0 26px;border:1px solid var(--border);background:var(--surface)}
  .apphead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
           padding:15px 20px;border-bottom:1px solid var(--border)}
  .apphead .t{font-family:var(--f-brand);font-weight:500;font-size:17px;letter-spacing:-.01em}
  .apphead .m{font-family:var(--f-tech);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
              color:var(--faint)}
  .appbody{padding:26px;background:var(--sunk)}
  .appfig figcaption{border-top:1px solid var(--border)}
  .built{font-family:var(--f-tech);font-size:11.5px;line-height:1.6;color:var(--muted);
         padding:14px 20px;border-top:1px solid var(--hair);background:var(--sunk)}
  .built b{color:var(--text);font-weight:400;letter-spacing:.1em;text-transform:uppercase;
           font-size:9.5px;display:block;margin-bottom:5px;color:var(--faint)}

  /* A — Hero mit diagonaler Ueberlagerung */
  .mk-hero{position:relative;aspect-ratio:16/8.2;background:#161816;overflow:hidden;
           font-family:var(--f-info);color:#f1f3f1}
  .mk-hero .ph{position:absolute;top:0;bottom:0;left:38%;right:0;
               background-size:cover;background-position:50% 42%}
  .mk-hero .pane{position:absolute;left:0;top:0;bottom:0;right:0;
                 background:#161816;
                 clip-path:polygon(0 0, 72% 0, 72% 18%, 34% 100%, 0 100%);
                 padding:clamp(16px,3.4%,40px) 0 clamp(16px,3.4%,40px) clamp(16px,3.4%,40px);
                 display:flex;flex-direction:column;justify-content:center}
  .mk-hero .kick{font-family:var(--f-tech);font-size:clamp(8px,1.05vw,12px);letter-spacing:.16em;
                 text-transform:uppercase;color:#9aa39b;margin:0 0 clamp(8px,1.6%,18px);
                 display:flex;align-items:center;gap:9px}
  .mk-hero .kick s{width:8px;height:8px;background:#009ee3;display:block;text-decoration:none}
  .mk-hero h4{font-family:var(--f-brand);font-weight:700;font-size:clamp(17px,3.2vw,39px);
              line-height:1.02;letter-spacing:-.03em;margin:0 0 clamp(8px,1.6%,16px);
              max-width:13ch;color:#f1f3f1}
  .mk-hero p{font-size:clamp(9px,1.2vw,14px);line-height:1.5;color:#b9c0ba;max-width:32ch;
             margin:0 0 clamp(10px,2.2%,22px)}
  .mk-hero .btn{font-family:var(--f-tech);font-size:clamp(8px,1.02vw,12px);letter-spacing:.12em;
                text-transform:uppercase;border:1px solid #f1f3f1;color:#f1f3f1;
                padding:clamp(5px,.9%,11px) clamp(10px,1.7%,20px);align-self:flex-start}

  /* Kantenformen */
  .edges{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
  .edge .ed{position:relative;aspect-ratio:16/10;background:#161816;overflow:hidden;margin-bottom:14px}
  .edge .ed .a{position:absolute;inset:0 0 0 36%;background-image:var(--ph);
               background-size:cover;background-position:50% 45%}
  .edge .ed .b{position:absolute;inset:0;background:#161816;
               display:flex;align-items:center;padding:0 8% 0 7%}
  .edge .ed .b em{font-family:var(--f-brand);font-weight:700;font-style:normal;box-shadow:none;
                  font-size:clamp(11px,1.35vw,16px);line-height:1.06;letter-spacing:-.028em;
                  color:#f1f3f1;max-width:9ch}
  .ed-v .b{clip-path:polygon(0 0,64% 0,64% 100%,0 100%)}
  .ed-d .b{clip-path:polygon(0 0,76% 0,76% 20%,32% 100%,0 100%)}
  .ed-h .b{clip-path:polygon(0 0,100% 0,100% 58%,0 58%)}
  .edge .en{font-family:var(--f-brand);font-weight:500;font-size:16px;margin:0 0 5px}
  .edge .ec{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}

  /* B — Ausschnitt und Ergaenzung */
  .mk-cut{position:relative;aspect-ratio:16/9;background:#161816;overflow:hidden;
          font-family:var(--f-info);color:#f1f3f1}
  .mk-cut .ph{position:absolute;inset:0;background-size:cover;background-position:50% 50%}
  .mk-cut .pl{position:absolute;background:#161816}
  .mk-cut .pl-top{left:0;right:0;top:0;height:54%;padding:clamp(14px,3.6%,40px)}
  .mk-cut .pl-left{left:0;top:54%;width:7%;bottom:0}
  .mk-cut .pl-right{left:35%;top:54%;right:0;bottom:0}
  .mk-cut .pl-bot{left:7%;top:90%;width:28%;bottom:0}
