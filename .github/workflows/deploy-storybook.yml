# Deploy Storybook
#
# VORAUSSETZUNG, DIE NICHT IM CODE STEHT
# GitHub Pages muss im Repository aktiviert sein, und zwar mit der Quelle
# „GitHub Actions" — nicht mit einem Branch:
#
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Fehlt das, laeuft der Bau fehlerfrei durch und NUR der letzte Schritt
# scheitert, mit einer Meldung, die wie ein Rechtefehler aussieht:
#
#   Failed to create deployment (status: 404)
#   HttpError: Not Found
#
# Am 19.08.2026 genau so passiert. Die Berechtigungen unten (pages: write,
# id-token: write) sind richtig gesetzt und waren nie das Problem — sie
# erlauben das Veroeffentlichen, aktivieren es aber nicht.

name: Deploy Storybook

on:
  push:
    branches: [main]
    paths:
      - 'data/*-recipe.json'
      - 'scss/**/*.scss'
      - 'stories/**'
      - 'scripts/generate-stories.mjs'
      - '.storybook/**'
      # Der Workflow gehoert in seinen eigenen Ausloeser.
      #
      # Ohne diese Zeile aendert man ihn, pusht — und nichts passiert. Genau
      # das ist am 19.08.2026 geschehen: Nach dem Aktivieren von GitHub Pages
      # wartete alles auf einen Lauf, den kein Push mehr ausloeste, weil der
      # letzte Push nur .github/ und agents/ beruehrt hatte.
      #
      # Ein Workflow, der sich selbst nicht beobachten kann, laesst sich nur
      # ueber den Knopf "Run workflow" pruefen — und das vergisst man.
      - '.github/workflows/deploy-storybook.yml'
      # Abhaengigkeiten aendern die gebaute Ausgabe genauso wie Quelldateien.
      - 'package.json'
      - 'package-lock.json'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Generate Stories from Recipes
        run: npm run generate:stories

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
