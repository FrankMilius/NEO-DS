# ==========================================================================
# Theme-Konfigurator — Release (Plan v2, 4.3)
# ==========================================================================
# Ein Tag `konfigurator-v<Version>` (z. B. konfigurator-v1.0.0) baut die App,
# prueft sie und legt ein GitHub-Release mit dem Bundle als ZIP an. Das ist
# das Paket, das die Entwickler in die neo Workplace Plattform uebernehmen.
# <Version> muss der "version" in apps/theme-configurator/package.json gleichen.
#
#   git tag konfigurator-v1.0.0 && git push origin konfigurator-v1.0.0
# ==========================================================================
name: Release Theme-Konfigurator

on:
  push:
    tags: ['konfigurator-v*']

permissions:
  contents: write

# Runner fest auf ubuntu-24.04 (Plan v3, Aufraeumen 05.10.2026): ubuntu-latest
# wechselt ab 19.10.2026 auf Ubuntu 26.04. Ein stiller Wechsel aendert
# Systemschriften, Chromium-Abhaengigkeiten und Toolchain — Playwright-Baselines
# und Budgets kippen dann ohne Codeaenderung. Umstieg bewusst als eigener
# Commit; pruefen spaetestens zum 30.06.2027 oder sobald GitHub die
# Abkuendigung von ubuntu-24.04 ankuendigt.
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/theme-configurator/package-lock.json
      - name: Tag passt zur App-Version (package.json, Plan v2 4.5)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#konfigurator-v}"
          APP_VERSION="$(node -p "require('./apps/theme-configurator/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu apps/theme-configurator/package.json ($APP_VERSION)"
            exit 1
          fi
      - run: npm ci
      - run: npm run build:css
      - name: App-Abhaengigkeiten
        working-directory: apps/theme-configurator
        run: npm ci
      - name: Tests
        working-directory: apps/theme-configurator
        run: npx vitest run
      - name: Build
        working-directory: apps/theme-configurator
        run: npx vite build
      - run: node scripts/pruefe-konfig-einstieg.cjs
      - run: node scripts/pruefe-bundle-budget.cjs
      - name: Paket schnueren
        run: |
          VERSION="${GITHUB_REF_NAME#konfigurator-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd config && zip -qr "../theme-configurator-$VERSION.zip" theme-config.html theme-configurator
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "theme-configurator-$VERSION.zip" \
            --title "Theme-Konfigurator $VERSION" \
            --notes "Gebautes Bundle des Theme-Konfigurators (config/theme-config.html + config/theme-configurator/). Tests, Einstieg und Bundle-Budget in diesem Lauf geprueft." \
            --verify-tag
