# ==========================================================================
# Theme-Konfigurator + Token-Waechter
# ==========================================================================
# Laeuft bei jeder Aenderung an App, Tokens, SCSS oder Skripten.
# Bis 29.09.2026 lief kein einziger App-Test automatisch: Das Root-
# vitest.config.js schliesst apps/** aus, ci.yml fuehrt nur agents:full aus.
# ==========================================================================
name: Theme-Konfigurator

on:
  push:
    branches: [main]
    paths:
      - 'apps/theme-configurator/**'
      - 'packages/**'
      - 'data/**'
      - 'scss/**'
      - 'scripts/**'
      - 'docs/**'
      - 'config/**'
      - '.github/workflows/theme-configurator.yml'
  pull_request:
    paths:
      - 'apps/theme-configurator/**'
      - 'packages/**'
      - 'data/**'
      - 'scss/**'
      - 'scripts/**'
      - 'docs/**'
      - 'config/**'
  # Von Hand: u. a. Screenshot-Baselines der Arenen neu schreiben (Job e2e-visuell)
  workflow_dispatch:
    inputs:
      screenshots_aktualisieren:
        description: 'Screenshot-Baselines neu schreiben (Artefakt e2e-screenshots-<sha>)'
        type: boolean
        default: false

concurrency:
  group: theme-configurator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Token-Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CSS bauen (Quelle fuer die Konfigurator-Bruecke)
        run: npm run build:css
      - name: JSON-Semantik == _mono-bridge.scss
        run: npm run tokens:semantik:check
      - name: Werkseinstellung der App == Quelle
        run: npm run tokens:werk:check
      - name: Foundation-Familien in der JSON == styles.css
        run: npm run tokens:foundation:check
      - name: DTCG-Export aktuell und verlustfrei (Style Dictionary)
        run: npm run tokens:dtcg:check
      - name: Generat aktuell (tokens.generated.js + .d.ts)
        run: |
          node scripts/generate-tokens.cjs
          # Datumszeile ignorieren, sonst waere jeder Tag eine Abweichung
          git diff -I 'Generated:' --exit-code -- apps/theme-configurator/src/data/tokens.generated.js apps/theme-configurator/src/data/tokens.generated.d.ts \
            || (echo "::error::tokens.generated.js/.d.ts ist veraltet — npm run tokens ausfuehren und committen"; exit 1)
      - name: Pruefvektoren fuer Drupal/PHP aktuell (data/pruefvektoren)
        run: npm run drupal:pruefvektoren:check
      - name: Docs-Seiten entstehen aus docs/content (keine Handaenderung)
        run: node scripts/build-docs.cjs --check
      - name: Validator nicht schlechter als der eingefrorene Bestand
        run: npm run lint:schwellen

  app:
    name: App — Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/theme-configurator/package-lock.json
      - name: Root-Abhaengigkeiten (sass fuer styles.css)
        run: npm ci
      - run: npm run build:css
      - name: App-Abhaengigkeiten
        working-directory: apps/theme-configurator
        run: npm ci
      # Plan v2, 3.2: 0 ESLint-Fehler; Typpruefung der @ts-check-Dateien
      - name: Lint (ESLint)
        working-directory: apps/theme-configurator
        run: npm run lint
      - name: Typen (tsc, @ts-check)
        working-directory: apps/theme-configurator
        run: npm run typecheck
      - name: Unit- und Komponententests
        working-directory: apps/theme-configurator
        run: npx vitest run
      - name: Build
        working-directory: apps/theme-configurator
        run: npx vite build
      # Plan v2, 4.3: das Bundle liegt nicht mehr im Repo. Jeder Build wird
      # als Artefakt veroeffentlicht (Actions → Lauf → Artifacts), Versionen
      # als GitHub-Release (release-konfigurator.yml).
      - name: Einstieg zeigt auf das gebaute Bundle
        run: node scripts/pruefe-konfig-einstieg.cjs
      - name: Bundle-Budget
        run: node scripts/pruefe-bundle-budget.cjs
      - name: Bundle als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: theme-configurator-${{ github.sha }}
          path: |
            config/theme-config.html
            config/theme-configurator/
          retention-days: 30

  # Plan v2, 4.2: Playwright gegen das gebaute Bundle aus dem Job app.
  # Smoke je Sektion, Kernablaeufe, axe mit Basislinie — CI-Gate.
  e2e:
    name: App — E2E (Playwright)
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/theme-configurator/package-lock.json
      - name: App-Abhaengigkeiten
        working-directory: apps/theme-configurator
        run: npm ci
      - name: Gebautes Bundle aus dem Job app
        uses: actions/download-artifact@v4
        with:
          name: theme-configurator-${{ github.sha }}
          path: config
      - name: Chromium fuer Playwright
        working-directory: apps/theme-configurator
        run: npx playwright install --with-deps chromium
      - name: E2E (Smoke, Ablaeufe, axe)
        working-directory: apps/theme-configurator
        run: npm run e2e
      - name: Report bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            apps/theme-configurator/playwright-report/
            apps/theme-configurator/test-results/
          retention-days: 14

  # Screenshot-Vergleich der Arenen (@visuell) — NICHT im Gate, nur von Hand.
  # Anleitung: apps/theme-configurator/e2e/README.md
  e2e-visuell:
    name: App — Screenshot-Vergleich (von Hand)
    if: github.event_name == 'workflow_dispatch'
    needs: app
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/theme-configurator/package-lock.json
      - name: App-Abhaengigkeiten
        working-directory: apps/theme-configurator
        run: npm ci
      - name: Gebautes Bundle aus dem Job app
        uses: actions/download-artifact@v4
        with:
          name: theme-configurator-${{ github.sha }}
          path: config
      - name: Chromium fuer Playwright
        working-directory: apps/theme-configurator
        run: npx playwright install --with-deps chromium
      - name: Screenshots vergleichen oder neu schreiben
        working-directory: apps/theme-configurator
        run: npm run e2e:visuell -- ${{ inputs.screenshots_aktualisieren && '--update-snapshots' || '' }}
      - name: Baselines als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: apps/theme-configurator/e2e/__screenshots__/
          retention-days: 14
      - name: Report bei Abweichungen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visuell-report-${{ github.sha }}
          path: |
            apps/theme-configurator/playwright-report/
            apps/theme-configurator/test-results/
          retention-days: 14
