name: NEO Design System CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Runner fest auf ubuntu-24.04 (Plan v3, Aufraeumen 05.10.2026): ubuntu-latest
# wechselt ab 19.10.2026 auf Ubuntu 26.04. Ein stiller Wechsel aendert
# Systemschriften, Chromium-Abhaengigkeiten und Toolchain — Playwright-Baselines
# und Budgets kippen dann ohne Codeaenderung. Umstieg bewusst als eigener
# Commit; pruefen spaetestens zum 30.06.2027 oder sobald GitHub die
# Abkuendigung von ubuntu-24.04 ankuendigt.
jobs:
  pipeline:
    name: Agent Network Pipeline
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Für --since=HEAD~1 im Orchestrator

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Agent Network (Full Pipeline)
        run: npm run agents:full

      - name: Upload Pipeline Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-report
          path: data/dashboard/last-pipeline-run.json

      - name: Generate Summary
        if: always()
        run: |
          if [ -f data/dashboard/metrics.json ]; then
            SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/dashboard/metrics.json','utf8')).overallScore)")
            STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/dashboard/metrics.json','utf8')).overallStatus)")
            CSS_SIZE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/dashboard/metrics.json','utf8')).buildHealth?.cssSizeFormatted || '?')")
            RECIPES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/dashboard/metrics.json','utf8')).recipeCompleteness?.total || '?')")
            TESTS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/dashboard/metrics.json','utf8')).testCoverage?.passed || '?')")
            STORIES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/dashboard/metrics.json','utf8')).docsCoverage?.withStory || '?')")

            echo "### Quality Dashboard: ${SCORE}/100 (${STATUS})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| KPI | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| CSS Size | ${CSS_SIZE} |" >> $GITHUB_STEP_SUMMARY
            echo "| Recipes | ${RECIPES} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests Passed | ${TESTS} |" >> $GITHUB_STEP_SUMMARY
            echo "| Storybook Stories | ${STORIES} |" >> $GITHUB_STEP_SUMMARY
          fi
